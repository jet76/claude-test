<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReadLater</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <span class="logo">ReadLater</span>
      <nav>
        <a href="#list" class="nav-link" data-view="list">List</a>
        <a href="#graph" class="nav-link" data-view="graph">Graph</a>
      </nav>
      <input type="search" id="search-input" placeholder="Search bookmarks…" autocomplete="off" />
      <button id="add-btn">+ Add URL</button>
    </div>
  </header>

  <main id="view-root"></main>

  <dialog id="bookmark-modal">
    <form id="bookmark-form" method="dialog">
      <h2 id="modal-title">Add Bookmark</h2>
      <label>
        URL
        <input type="url" id="modal-url" placeholder="https://…" required />
      </label>
      <div class="modal-actions">
        <button type="button" id="modal-cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
